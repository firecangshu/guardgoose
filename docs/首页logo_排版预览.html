<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页（登录页）改动预览 · 护院鹅</title>
<style>
  body {
    margin: 0;
    background: #e9ebf0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  .phone {
    width: 390px;
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,.15);
    overflow: hidden;
  }
  .screen {
    height: 800px;
    overflow-y: auto;
  }

  /* ---- 以下完全复刻 LoginView.vue，仅改三处 ---- */
  .login-page {
    min-height: 800px;
    background: linear-gradient(160deg, #e8f5e9 0%, #f7f8fa 45%);
    display: flex;
    flex-direction: column;
    padding: 160px 24px 24px;
    box-sizing: border-box;
  }
  .login-hero {
    text-align: center;
    margin-bottom: 56px;
  }
  .login-logo {
    width: 180px;
    max-width: 56vw;
    height: auto;
    display: block;
    margin: 0 auto 16px;
    filter: drop-shadow(0 6px 18px rgba(26, 58, 110, 0.18));
  }
  .app-slogan {
    font-size: 17px;
    color: #86909c;
    margin: 0;
    letter-spacing: 1px;
  }
  .form-card {
    background: #fff;
    border-radius: 8px;
    margin: 0 12px 32px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  .form-card label {
    font-size: 14px;
    color: #323233;
    flex-shrink: 0;
  }
  .form-card span.ph {
    font-size: 14px;
    color: #c8c9cc;
  }
  .btn {
    display: block;
    width: calc(100% - 24px);
    margin: 0 12px;
    padding: 13px 0;
    text-align: center;
    background: #07c160;
    color: #fff;
    font-size: 16px;
    border-radius: 999px;
    box-sizing: border-box;
  }
  .login-tip {
    font-size: 12px;
    color: #969799;
    text-align: center;
    margin-top: 18px;
    line-height: 1.6;
    padding: 0 24px;
  }
  .login-footer {
    margin-top: auto;
    text-align: center;
    font-size: 12px;
    color: #c9cdd4;
  }

  /* ---- 预览页改动标注 ---- */
  .change-note {
    max-width: 390px;
    margin: 14px auto 0;
    font-size: 12px;
    color: #6b7280;
    line-height: 1.8;
  }
  .change-note b { color: #07c160; }
</style>
</head>
<body>
<div>
  <div class="phone">
    <div class="screen">
      <div class="login-page">
        <div class="login-hero">
          <!-- 改动①：新 LOGO，中英文间距拉大 -->
          <img class="login-logo" src="guardgoose_wide_preview.png" alt="护院鹅 Guard Goose" />
          <!-- 改动②：新标语 -->
          <p class="app-slogan">无感守护 爱永相随</p>
        </div>

        <div class="form-card">
          <label>守护人</label>
          <span class="ph">请输入被守护老人的称呼，如：妈妈</span>
        </div>

        <div class="btn">进入守护</div>
        <p class="login-tip">首次使用将引导您了解项目功能，并为守护人建立个性化健康档案</p>

        <div class="login-footer">
          <!-- 改动③：新页脚 -->
          <span>AI向善 · v1.0.0</span>
        </div>
      </div>
    </div>
  </div>

  <div class="change-note">
    本次改动三处：<br>
    ① LOGO 中「护院鹅」与「GUARD GOOSE」间距拉大（18px → 48px）<br>
    ② 标语：CSI无感守护 · 让爱不缺席 → <b>无感守护 爱永相随</b><br>
    ③ 页脚：小有可为 · AI向善创新挑战赛 → <b>AI向善 · v1.0.0</b>（版本号待定，可改）
  </div>
</div>
</body>
</html>
